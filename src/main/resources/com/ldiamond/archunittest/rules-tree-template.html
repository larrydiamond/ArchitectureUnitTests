<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Architecture Rules Tree</title>
    <!-- Generated by com.ldiamond.archunittest.RuleTreeReport from the ArchitectureRule enum. Do not edit by hand. -->
    <script>document.documentElement.classList.add('js');</script>
    <style>
        :root {
          --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
          --accent: #2f5bd3; --accent-soft: #e6ecfb; --code-bg: #f1f0ec; --hit: #fff3c4;
          --radius: 8px;
          color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --bg: #151514; --panel: #1e1e1c; --text: #ecebe6; --muted: #9c9b94; --line: #33332f;
            --accent: #8aa8ff; --accent-soft: #24304f; --code-bg: #262623; --hit: #4a3f12;
            color-scheme: dark;
          }
        }
        * { box-sizing: border-box; }
        body {
          margin: 0; background: var(--bg); color: var(--text);
          font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.86em; }
        .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
        header h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: -0.01em; }
        header .meta { color: var(--muted); margin: 0 0 20px; }

        .toolbar {
          position: sticky; top: 0; z-index: 2; background: var(--bg);
          display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
          padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 8px;
        }
        .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
        .segmented button { border: 0; background: none; color: var(--text); padding: 6px 12px; font: inherit; cursor: pointer; }
        .segmented button + button { border-left: 1px solid var(--line); }
        .segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
        input[type="search"] {
          flex: 1 1 220px; min-width: 0; padding: 6px 10px; font: inherit; color: var(--text);
          background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
        }
        .btn { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text); cursor: pointer; }
        .btn:hover, .segmented button:hover { color: var(--accent); }
        .status { color: var(--muted); font-size: 0.9em; }

        .tagbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 16px; }
        .tag {
          font: inherit; font-size: 0.78rem; line-height: 1; padding: 4px 8px; cursor: pointer;
          border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted);
        }
        .tag:hover { color: var(--accent); border-color: var(--accent); }
        .tag.active { background: var(--accent); border-color: var(--accent); color: var(--panel); }

        .js .view { display: none; }
        .js .view.active { display: block; }
        .view + .view { margin-top: 32px; }
        .js .view + .view { margin-top: 0; }

        details { border-radius: var(--radius); }
        summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 10px; padding: 7px 10px; border-radius: var(--radius); }
        summary::-webkit-details-marker { display: none; }
        summary::before {
          content: ""; flex: none; width: 0; height: 0; align-self: center;
          border-left: 5px solid var(--muted); border-top: 4px solid transparent; border-bottom: 4px solid transparent;
          transition: transform .12s ease;
        }
        details[open] > summary::before { transform: rotate(90deg); }
        summary:hover { background: var(--accent-soft); }
        summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

        .group[data-depth="1"] { background: var(--panel); border: 1px solid var(--line); margin-bottom: 10px; }
        .group[data-depth="1"] > summary { padding: 12px 14px; }
        .group[data-depth="1"] > summary .label { font-size: 1.05rem; font-weight: 650; }
        .group .label { font-weight: 600; }
        .count {
          flex: none; font-size: 0.75rem; font-weight: 600; color: var(--accent); background: var(--accent-soft);
          padding: 1px 7px; border-radius: 999px;
        }
        .desc { color: var(--muted); font-size: 0.9em; min-width: 0; }
        .children { margin: 0 0 6px 18px; padding-left: 10px; border-left: 1px solid var(--line); }
        .group[data-depth="1"] > .children { margin: 0 14px 12px 22px; }

        .rule > summary { align-items: center; }
        .rule .name { font-weight: 600; flex: none; max-width: 100%; overflow-wrap: anywhere; }
        .rule .what { color: var(--muted); font-size: 0.88em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rule[open] > summary .what { display: none; }
        .rule.hit > summary { background: var(--hit); }
        .facts {
          display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 2px 0 12px 26px;
          padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
        }
        .facts dt { color: var(--muted); font-size: 0.85em; padding-top: 1px; }
        .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
        .facts .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .snippet { margin: 0 0 6px; padding: 8px 10px; background: var(--code-bg); border-radius: 6px; overflow-x: auto; }
        .copy { font: inherit; font-size: 0.8rem; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
        .permalink { font-size: 0.8rem; color: var(--accent); }
        [hidden] { display: none !important; }
        .empty { color: var(--muted); padding: 24px 0; }

        @media (max-width: 640px) {
          .toolbar { position: static; }
          .facts { grid-template-columns: 1fr; margin-left: 0; }
          .facts dt { padding-top: 6px; }
          .rule .what { display: none; }
          .children { margin-left: 8px; }
          .group[data-depth="1"] > .children { margin: 0 8px 10px 10px; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>Architecture rules{{VERSION}}</h1>
        <p class="meta">{{SUMMARY}} &middot; generated from <code>ArchitectureRule</code></p>
    </header>

    <div class="toolbar" role="toolbar" aria-label="Tree controls">
        <div class="segmented" role="group" aria-label="Group by">
            <button type="button" data-view-btn="category" aria-pressed="true">Category</button>
            <button type="button" data-view-btn="tag" aria-pressed="false">Tag</button>
            <button type="button" data-view-btn="since" aria-pressed="false">Version</button>
        </div>
        <input type="search" id="q" placeholder="Filter rules: name, text, tag&hellip;" aria-label="Filter rules">
        <button type="button" class="btn" id="expand">Expand all</button>
        <button type="button" class="btn" id="collapse">Collapse all</button>
        <span class="status" id="status" aria-live="polite"></span>
    </div>
    <div class="tagbar" aria-label="Filter by tag">{{TAGS}}</div>

    <main id="tree">
        {{VIEWS}}
        <p class="empty" id="empty" hidden>No rules match the current filter.</p>
    </main>
</div>

<script>
    (function () {
      var activeView = 'category';
      var activeTags = new Set();
      var q = document.getElementById('q');
      var status = document.getElementById('status');
      var empty = document.getElementById('empty');

      function view() { return document.querySelector('.view[data-view="' + activeView + '"]'); }
      function store(key, value) { try { localStorage.setItem('rulesTree.' + key, value); } catch (e) { /* storage unavailable */ } }
      function load(key) { try { return localStorage.getItem('rulesTree.' + key); } catch (e) { return null; } }

      function showView(id) {
        if (!document.querySelector('.view[data-view="' + id + '"]')) { id = 'category'; }
        activeView = id;
        document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('active', v.dataset.view === id); });
        document.querySelectorAll('[data-view-btn]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.viewBtn === id)); });
        store('view', id);
        applyFilter();
      }

      // Searchable text: the rule summary and facts, but not the Exclude row (its snippet and buttons would match everything).
      function searchText(rule) {
        var parts = [rule.querySelector('summary').textContent];
        var dds = rule.querySelectorAll('.facts > dd');
        for (var i = 0; i < dds.length - 1; i++) { parts.push(dds[i].textContent); }
        return parts.join(' ').toLowerCase();
      }

      function filtering() { return q.value.trim() !== '' || activeTags.size > 0; }

      function applyFilter() {
        var terms = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
        var root = view();
        var shown = new Set();
        root.querySelectorAll('.rule').forEach(function (r) {
          var tags = r.dataset.tags.split(' ');
          if (!r._text) { r._text = searchText(r); }
          var ok = terms.every(function (t) { return r._text.indexOf(t) >= 0; }) &&
                   Array.from(activeTags).every(function (t) { return tags.indexOf(t) >= 0; });
          r.hidden = !ok;
          r.classList.toggle('hit', ok && filtering());
          if (ok) { shown.add(r.dataset.rule); }
        });
        // Hide empty groups; when filtering, open the groups that contain matches (progressive disclosure on demand).
        Array.from(root.querySelectorAll('.group')).reverse().forEach(function (g) {
          var visible = g.querySelector('.rule:not([hidden])') !== null;
          g.hidden = !visible;
          if (filtering() && visible) { g.open = true; }
        });
        empty.hidden = shown.size > 0;
        status.textContent = filtering() ? shown.size + ' matching rule' + (shown.size === 1 ? '' : 's') : '';
        document.querySelectorAll('.tag').forEach(function (b) { b.classList.toggle('active', activeTags.has(b.dataset.tag)); });
      }

      function setAll(open) { view().querySelectorAll('details:not([hidden])').forEach(function (d) { d.open = open; }); }

      function reveal(name) {
        var r = view().querySelector('.rule[data-rule="' + CSS.escape(name) + '"]');
        if (!r) { return; }
        if (r.hidden) { q.value = ''; activeTags.clear(); applyFilter(); }
        for (var d = r; d; d = d.parentElement && d.parentElement.closest('details')) { d.open = true; }
        r.scrollIntoView({ block: 'center' });
        r.querySelector('summary').focus({ preventScroll: true });
      }

      document.addEventListener('click', function (e) {
        var t = e.target;
        if (t.matches('[data-view-btn]')) { showView(t.dataset.viewBtn); return; }
        if (t.matches('.tag')) {
          e.preventDefault();
          var tag = t.dataset.tag;
          if (activeTags.has(tag)) { activeTags.delete(tag); } else { activeTags.add(tag); }
          applyFilter();
          return;
        }
        if (t.matches('.copy')) {
          var code = t.parentElement.querySelector('code').textContent;
          var done = function () { t.textContent = 'Copied'; setTimeout(function () { t.textContent = 'Copy'; }, 1200); };
          try { navigator.clipboard.writeText(code).then(done, function () {}); } catch (err) { /* clipboard unavailable */ }
        }
      });
      document.getElementById('expand').addEventListener('click', function () { setAll(true); });
      document.getElementById('collapse').addEventListener('click', function () { setAll(false); });
      q.addEventListener('input', applyFilter);
      window.addEventListener('hashchange', function () { reveal(decodeURIComponent(location.hash.slice(1))); });

      showView(load('view') || 'category');
      if (location.hash.length > 1) { reveal(decodeURIComponent(location.hash.slice(1))); }
    })();
</script>
</body>
</html>
